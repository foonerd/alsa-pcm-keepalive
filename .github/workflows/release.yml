name: release

# A tag builds the release: the check and the cross builds in the builder image, the
# plugin zip, then one job that signs it (MANIFEST inside, SHA256SUMS beside) and
# publishes it as a pre-release with the notes from the changelog. Run by hand it builds
# everything and publishes nothing.
on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check:
    name: C, tests, analyzer, shell, plugin, workflows
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - name: The tag names the version the plugin carries
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          version=$(sed -n 's/^ *"version": "\(.*\)",*$/\1/p' plugin/package.json | head -n1)
          [ "$GITHUB_REF_NAME" = "v$version" ] || { echo "the tag is $GITHUB_REF_NAME, plugin/package.json is $version" >&2; exit 1; }
          grep -q "^## \[$version\]" CHANGELOG.md || { echo "CHANGELOG.md has no section for $version" >&2; exit 1; }
      - run: scripts/check.sh

  ship:
    name: cross builds, the plugin zip
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - run: scripts/ship.sh
      - run: scripts/package.sh
      - name: The zip names the commit it was built from
        run: |
          unzip -p dist/audio_keepalive-*.zip build.json | grep -F "\"commit\": \"$(git rev-parse --short HEAD)\""
      - name: The zip carries the daemon and the ALSA client for every architecture, the licence, and the modules
        run: |
          for arch in arm armv7 armv8 x64; do
            for file in audio-keepalive-daemon libasound_module_pcm_keepalive.so; do
              unzip -l dist/audio_keepalive-*.zip | grep -q " bin/$arch/$file\$" || { echo "no bin/$arch/$file in the zip" >&2; exit 1; }
            done
          done
          unzip -l dist/audio_keepalive-*.zip | grep -q " LICENSE\$" || { echo "no LICENSE in the zip" >&2; exit 1; }
          for module in fs-extra kew v-conf; do
            unzip -l dist/audio_keepalive-*.zip | grep -q " node_modules/$module/package.json\$" || { echo "no module $module in the zip" >&2; exit 1; }
          done
      - uses: actions/upload-artifact@v7
        with:
          name: release-plugin
          path: dist/audio_keepalive-*.zip
          if-no-files-found: error

  publish:
    name: sign, publish
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [check, ship]
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
      - uses: actions/download-artifact@v8
        with:
          name: release-plugin
          path: dist
      # The zip carries MANIFEST, every file's digest, and its Ed25519 signature; beside
      # it SHA256SUMS and its signature. The private key comes from the repository's
      # secret RELEASE_SIGNING_KEY (PEM); the public key in keys/release-signing.pub
      # checks every signature before anything is published. A release is never
      # published unsigned.
      - name: Sign the release
        env:
          RELEASE_SIGNING_KEY: ${{ secrets.RELEASE_SIGNING_KEY }}
        run: |
          if [ -z "$RELEASE_SIGNING_KEY" ]; then
            echo "no RELEASE_SIGNING_KEY in this repository: a release is never published unsigned" >&2
            exit 1
          fi
          scripts/sign-release.sh dist keys/release-signing.pub
      - name: Notes from the changelog, with the sponsorship footer
        run: |
          version="${GITHUB_REF_NAME#v}"
          {
            scripts/release-notes.sh "$version"
            printf '\n'
            cat .github/release-footer.md
          } > dist/notes.md
      # Published as a pre-release until it has been tried on a player; made the latest
      # by hand then (gh release edit <tag> --prerelease=false --latest).
      - name: Publish
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" --title "$GITHUB_REF_NAME" --notes-file dist/notes.md --prerelease \
            dist/audio_keepalive-*.zip dist/SHA256SUMS dist/SHA256SUMS.sig
